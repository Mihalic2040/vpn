services:
  wireguard:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wireguard-server
    restart: unless-stopped
    environment:
      INSECURE: "true"
      DISABLE_IPV6: "true"
      INIT_ENABLED: "true"
      INIT_USERNAME: "${WG_USERNAME:?WG_USERNAME is required}"
      INIT_PASSWORD: "${WG_PASSWORD:?WG_PASSWORD is required}"
      INIT_HOST: "${WG_HOST:?WG_HOST is required}"
      INIT_PORT: "51820"
      INIT_ALLOWED_IPS: "10.8.0.0/24"
    command:
      - /usr/bin/dumb-init
      - /bin/sh
      - -ec
      - |
        node server/index.mjs &
        app_pid=$$!
        trap 'kill -TERM "$$app_pid"; wait "$$app_pid"' TERM INT
        until ip link show wg0 >/dev/null 2>&1; do
          kill -0 "$$app_pid"
          sleep 1
        done
        iptables -I FORWARD 1 -i wg0 -o wg0 -j ACCEPT
        iptables -I FORWARD 2 -i wg0 ! -o wg0 -j REJECT
        wait "$$app_pid"
    volumes:
      - wireguard-data:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"

volumes:
  wireguard-data:
