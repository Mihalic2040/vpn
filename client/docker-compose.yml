services:
  wireguard-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wireguard-client-proxy
    restart: unless-stopped
    network_mode: host
    environment:
      WG_PRIVATE_KEY: "${WG_PRIVATE_KEY:?WG_PRIVATE_KEY is required}"
      WG_ADDRESS: "${WG_ADDRESS:?WG_ADDRESS is required}"
      WG_MTU: "${WG_MTU:-1200}"
      WG_SERVER_PUBLIC_KEY: "${WG_SERVER_PUBLIC_KEY:?WG_SERVER_PUBLIC_KEY is required}"
      WG_PRESHARED_KEY: "${WG_PRESHARED_KEY:?WG_PRESHARED_KEY is required}"
      WG_ENDPOINT: "${WG_ENDPOINT:?WG_ENDPOINT is required}"
      WG_ALLOWED_IPS: "${WG_ALLOWED_IPS:?WG_ALLOWED_IPS is required}"
      WG_PERSISTENT_KEEPALIVE: "${WG_PERSISTENT_KEEPALIVE:-25}"
      ROUTES_JSON: "${ROUTES_JSON:?ROUTES_JSON is required}"
